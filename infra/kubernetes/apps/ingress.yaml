apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stimpact-control-plane
  namespace: control-plane
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: CHANGE_ME_ACM_CERTIFICATE_ARN
spec:
  rules:
    - host: stimpact.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: stimpact-ui
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stimpact-ui
                port:
                  number: 3000
