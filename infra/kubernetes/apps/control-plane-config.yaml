apiVersion: v1
kind: ConfigMap
metadata:
  name: stimpact-runtime-config
  namespace: control-plane
data:
  AGENT_PLATFORM_ENVIRONMENT: production
  AGENT_PLATFORM_RUN_MIGRATIONS: "false"
  AGENT_PLATFORM_REQUIRE_DATABASE: "true"
  AGENT_PLATFORM_REQUIRE_REDIS: "true"
  AGENT_PLATFORM_STRICT_READINESS: "true"
  AGENT_PLATFORM_REQUIRE_CONTROL_PLANE_AUTH: "true"
  AGENT_PLATFORM_REQUIRE_PROJECT_API_KEYS: "true"
  AGENT_PLATFORM_CONTROL_PLANE_NAMESPACE: control-plane
  AGENT_PLATFORM_CONTROL_PLANE_SERVICE_ACCOUNT: stimpact-control-plane
  AGENT_PLATFORM_SANDBOX_NAMESPACE: sandbox
  AGENT_PLATFORM_SANDBOX_SERVICE_ACCOUNT: stimpact-sandbox-job
  AGENT_PLATFORM_SANDBOX_EXECUTION_BACKEND: kubernetes
  AGENT_PLATFORM_API_URL: http://stimpact-api.control-plane.svc.cluster.local:8000
  AGENT_PLATFORM_PUBLIC_BASE_URL: https://stimpact.example.com
  AGENT_PLATFORM_S3_ARTIFACT_BUCKET: CHANGE_ME_ARTIFACT_BUCKET
  AGENT_PLATFORM_EKS_CLUSTER_NAME: stimpactai-cluster
  AGENT_PLATFORM_CONTROL_PLANE_RATE_LIMIT_PER_MINUTE: "120"
  AGENT_PLATFORM_TELEMETRY_RATE_LIMIT_PER_MINUTE: "600"
---
apiVersion: v1
kind: Secret
metadata:
  name: stimpact-runtime-secrets
  namespace: control-plane
type: Opaque
stringData:
  DATABASE_URL: CHANGE_ME
  REDIS_URL: CHANGE_ME
  AGENT_PLATFORM_ADMIN_TOKEN: CHANGE_ME
  OPENAI_API_KEY: CHANGE_ME
  GITHUB_APP_ID: CHANGE_ME
  GITHUB_PRIVATE_KEY: CHANGE_ME
  GITHUB_CLIENT_ID: CHANGE_ME
  GITHUB_CLIENT_SECRET: CHANGE_ME
  GITHUB_WEBHOOK_SECRET: CHANGE_ME
  GITLAB_APPLICATION_ID: CHANGE_ME
  GITLAB_APP_SECRET: CHANGE_ME
