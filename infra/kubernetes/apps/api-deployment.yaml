apiVersion: apps/v1
kind: Deployment
metadata:
  name: stimpact-api
  namespace: control-plane
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: stimpact-api
  template:
    metadata:
      labels:
        app: stimpact-api
        stimpact.ai/workload: control-plane
    spec:
      serviceAccountName: stimpact-control-plane
      automountServiceAccountToken: true
      nodeSelector:
        stimpact.ai/workload: control-plane
      containers:
        - name: api
          image: CHANGE_ME_ECR_URI/agent-platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: stimpact-runtime-config
            - secretRef:
                name: stimpact-runtime-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: stimpact-api
  namespace: control-plane
spec:
  selector:
    app: stimpact-api
  ports:
    - name: http
      port: 8000
      targetPort: http
