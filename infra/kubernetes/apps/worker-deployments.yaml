apiVersion: apps/v1
kind: Deployment
metadata:
  name: stimpact-outbox-worker
  namespace: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stimpact-outbox-worker
  template:
    metadata:
      labels:
        app: stimpact-outbox-worker
        stimpact.ai/workload: control-plane
    spec:
      serviceAccountName: stimpact-control-plane
      nodeSelector:
        stimpact.ai/workload: control-plane
      containers:
        - name: worker
          image: CHANGE_ME_ECR_URI/agent-platform:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "worker_runner.py", "outbox"]
          workingDir: /app/agent-platform
          envFrom:
            - configMapRef:
                name: stimpact-runtime-config
            - secretRef:
                name: stimpact-runtime-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
