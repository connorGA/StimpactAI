apiVersion: v1
kind: ServiceAccount
metadata:
  name: stimpact-sandbox-job
  namespace: sandbox
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_SANDBOX_JOB_ROLE_ARN
