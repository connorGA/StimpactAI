    stimpact.ai/role: control-plane
---
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox
  labels:
    stimpact.ai/role: sandbox
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stimpact-control-plane
