name: Build And Publish Images

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  publish-images:
    if: ${{ vars.AWS_REGION != '' && vars.ECR_REGISTRY != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        env:
          IMAGE_URI: ${{ vars.ECR_REGISTRY }}/agent-platform:${{ github.sha }}
        run: |
          docker build -t "$IMAGE_URI" -f agent-platform/Dockerfile .
          docker push "$IMAGE_URI"

      - name: Build and push frontend image
        env:
          IMAGE_URI: ${{ vars.ECR_REGISTRY }}/client-ui:${{ github.sha }}
        run: |
          docker build -t "$IMAGE_URI" -f client-ui/Dockerfile .
          docker push "$IMAGE_URI"
