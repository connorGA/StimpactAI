[project]
name = "agent-platform"
version = "0.1.0"
description = "Telemetry ingestion and autonomous remediation backend."
requires-python = ">=3.12"
dependencies = [
    "asyncpg",
    "fastapi",
    "openai",
    "python-dotenv",
    "redis[hiredis]",
    "uvicorn[standard]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
