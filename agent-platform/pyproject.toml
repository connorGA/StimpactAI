[project]
name = "agent-platform"
version = "0.1.0"
description = "Telemetry ingestion and autonomous remediation backend."
requires-python = ">=3.12"
dependencies = [
    "asyncpg",
    "boto3",
    "fastapi",
    "httpx",
    "openai",
    "PyJWT",
    "PyYAML",
    "python-dotenv",
    "python-multipart",
    "redis[hiredis]",
    "sourcemap",
    "uvicorn[standard]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["tests"]
